project:
  type: website
  output-dir: docs

  render:
    - index.qmd
    - rsv.qmd
    - pertussis.qmd

  resources:
    - maps/**

website:
  title: "Disease Notification Rates"

  navbar:
    search: true
    left:
      - text: "Home"
        href: index.qmd

  sidebar:
    style: docked
    background: light
    border: true
    collapse-level: 1

    header: |
      ### Select a disease

    contents:
      - section: "Disease maps"
        contents:
          - text: "Respiratory syncytial virus"
            href: rsv.qmd

          - text: "Pertussis"
            href: pertussis.qmd

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    page-layout: full
    include-in-header:
      text: |
        <meta name="robots" content="noindex, nofollow, noarchive">

editor: visual